name: Build Champak Screen Recorder APK
on:
  push:
    branches:
      - screen-recorder-teaching-edition
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Unpack recorder source
        run: |
          mkdir -p /tmp/screen-recorder-build
          unzip -q build-assets/champaks_screen_recorder_source.zip -d /tmp/screen-recorder-build
      - name: Generate Flutter Android scaffold
        working-directory: /tmp/screen-recorder-build/champaks_screen_recorder
        run: bash scripts/prepare_android.sh
      - name: Select preinstalled Android NDK
        working-directory: /tmp/screen-recorder-build/champaks_screen_recorder
        run: |
          set -euo pipefail
          echo "Runner preinstalled NDK: $ANDROID_NDK_HOME"
          test -d "$ANDROID_NDK_HOME"
          NDK_VERSION="$(basename "$ANDROID_NDK_HOME")"
          sed -i "s/ndkVersion = flutter.ndkVersion/ndkVersion = \"$NDK_VERSION\"/" android/app/build.gradle.kts
          grep ndkVersion android/app/build.gradle.kts
      - name: Dart static analysis
        working-directory: /tmp/screen-recorder-build/champaks_screen_recorder
        run: flutter analyze --no-fatal-infos lib/main.dart
      - name: Build debug APK
        working-directory: /tmp/screen-recorder-build/champaks_screen_recorder
        run: flutter build apk --debug
      - name: Collect APK
        run: |
          cp /tmp/screen-recorder-build/champaks_screen_recorder/build/app/outputs/flutter-apk/app-debug.apk Champaks-Screen-Recorder-Teaching-v0.1.0-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Champaks-Screen-Recorder-Teaching-APK
          path: Champaks-Screen-Recorder-Teaching-v0.1.0-debug.apk
          if-no-files-found: error
